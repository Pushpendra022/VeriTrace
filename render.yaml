services:
  - type: web
    name: veritrace-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: VeriTrace
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: ENABLE_LLM
        value: true
      - key: MAX_UPLOAD_MB
        value: 20
      - key: MAX_DOCUMENT_CHARACTERS
        value: 1000000
      - key: MAX_EXTRACTED_CLAIMS
        value: 15
      - key: MAX_BULK_VERIFICATION
        value: 15
      - key: REVIEW_RETENTION_DAYS
        value: 7
      - key: LOG_LEVEL
        value: INFO
